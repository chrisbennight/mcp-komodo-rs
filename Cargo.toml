[workspace]
resolver = "3"
members = [
    "crates/komodo-api",
    "crates/komodo-mcp",
    "crates/komodo-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/chrisbennight/mcp-komodo-rs"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "2.2", features = ["pkcs8"] }
jsonwebtoken = { version = "10", default-features = false, features = ["aws_lc_rs"] }
jsonschema = { version = "0.52", default-features = false }
komodo-api = { version = "0.1.0", path = "crates/komodo-api" }
komodo-mcp = { version = "0.1.0", path = "crates/komodo-mcp" }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rmcp = { version = "=2.2.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
schemars = "1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "1"
subtle = "2.6.1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower = { version = "0.5", features = ["limit", "util"] }
tower-http = { version = "0.7", features = ["timeout", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
wiremock = "0.6"
zeroize = "1.8"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
