name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          rust-version: "1.96.0"
          arguments: --all-features --locked
          command: check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # renovate: datasource=github-tags depName=rust-lang/rustup
      RUSTUP_INIT_VERSION: "1.29.1"
      RUSTUP_INIT_SHA256: "dda7234360b7f578ca8b0ddcb80145646fa61a67c1720a5abc7051b35c9fcb71"
      RUST_TOOLCHAIN_VERSION: "1.96.0"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl -fsSL -o /tmp/rustup-init \
              "https://static.rust-lang.org/rustup/archive/${RUSTUP_INIT_VERSION}/x86_64-unknown-linux-gnu/rustup-init"
            echo "${RUSTUP_INIT_SHA256}  /tmp/rustup-init" | sha256sum -c -
            chmod +x /tmp/rustup-init
            /tmp/rustup-init -y --default-toolchain none --profile minimal --no-modify-path
            rm -f /tmp/rustup-init
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup toolchain install "${RUST_TOOLCHAIN_VERSION}" --profile minimal --component rustfmt,clippy
          rustup default "${RUST_TOOLCHAIN_VERSION}"

      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Lint all targets
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test all features
        run: cargo test --workspace --all-features --locked
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked
      - name: Validate documentation links
        run: python3 scripts/check_docs.py
      - name: Test repository tooling
        run: python3 -m unittest discover -s scripts/tests
      - name: Package dependency license notices
        run: python3 scripts/package_notices.py
      - name: Retain dependency notices
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-notices-${{ github.sha }}
          path: artifacts/dependency-notices.*
          if-no-files-found: error
          retention-days: 90
      - name: Verify generated gateway manifest
        run: |
          cargo run --locked -p komodo-server -- --emit-gateway-manifest > /tmp/komodo.yaml
          grep -q '^name: komodo$' /tmp/komodo.yaml
          grep -q '^  - name: stacks.deploy$' /tmp/komodo.yaml

  image:
    if: github.event_name != 'push'
    needs: [test, dependencies]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and smoke the source image
        run: bash scripts/test_image.sh
      - name: Scan the tested image and generate release evidence
        run: bash scripts/scan_image.sh
      - name: Retain image inventory and scan reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-evidence-${{ github.sha }}
          path: artifacts/*.json
          if-no-files-found: error
          retention-days: 90

  publish:
    if: >-
      github.event_name == 'push' &&
      github.repository == 'chrisbennight/mcp-komodo-rs' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [test, dependencies]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate publication context
        run: python3 scripts/publish_image.py --check
      - name: Build and smoke the source image
        run: bash scripts/test_image.sh
      - name: Scan the tested image and generate release evidence
        run: bash scripts/scan_image.sh
      - name: Retain image inventory and scan reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-evidence-${{ github.sha }}
          path: artifacts/*.json
          if-no-files-found: error
          retention-days: 90
      - name: Publish the tested image
        id: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/publish_image.py
      - name: Attest the verified registry manifest
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/chrisbennight/mcp-komodo-rs
          subject-digest: ${{ steps.publish.outputs.image_digest }}
          push-to-registry: false
          create-storage-record: false
      - name: Attest the image OS inventory
        id: sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/chrisbennight/mcp-komodo-rs
          subject-digest: ${{ steps.publish.outputs.image_digest }}
          sbom-path: artifacts/sbom.cdx.json
          push-to-registry: false
          create-storage-record: false
      - name: Download notices from this workflow's validated test job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dependency-notices-${{ github.sha }}
          path: artifacts
          digest-mismatch: error
      - name: Assemble release evidence
        env:
          PUBLISHED_IMAGE_DIGEST: ${{ steps.publish.outputs.image_digest }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom.outputs.bundle-path }}
        run: python3 scripts/package_release_evidence.py
      - name: Retain the complete release evidence bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-${{ github.sha }}
          path: artifacts/release-evidence.*
          if-no-files-found: error
          retention-days: 90
