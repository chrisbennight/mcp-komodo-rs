blocked_paths: []
notes:
  - "This library is a semantic MCP interface with named typed operations. Access, disclosure, risk, approval, and role policy belong to the operator outside the library. Do not impose capability bans or hide supported facts based on presumed sensitivity. Preserve authentication, validation, bounded request cost, and protection against injection."
  - "Read and administrative Komodo identities are distinct. A handler must not dynamically choose credentials from caller input."
  - "Mutations validate before the upstream call and are never retried after an ambiguous transport result."
  - "The tool registry describes tools/list and factual MCP operation behavior. Operator policy determines risk, disclosure, roles, and approval. Review concrete invariants and current-head evidence; do not treat previous sensitivity labels or local role prescriptions as architecture."
  - "A secret is an actual password, token, API key, or equivalent credential value. Those values use governed file transfer outside model context in both directions; preserve credential operations and separately usable metadata. Logs, Compose, environment content, commands, addresses, public keys, paths, and identities are not categorically secrets. Do not add speculative content scanning or blanket suppression."
  - "Credential values and request/result payloads stay out of telemetry, approvals, and audit records. Tests use non-production sentinels. Tools that submit values to Komodo must accurately describe upstream retention."
  - "Dockerfile and workflow changes are supply-chain sensitive. Preserve digest pins, locked builds, non-root runtime, and job-scoped publication credentials. Pull requests cannot publish images."
