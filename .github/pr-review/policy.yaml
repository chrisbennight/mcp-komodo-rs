enabled: true
repo: chrisbennight/mcp-komodo-rs
base_branches:
  - main
renovate_mode: eval
status_context: pr-review/gate
intent_sources:
  include_pr_body: true
  include_linked_issues: true
  include_pr_comments: true
  include_referenced_files: true
intent_requirements:
  require_design_goal: true
  require_acceptance_criteria: true
  minimum_sections_present: 2
  max_referenced_files: 8
  allowed_reference_extensions:
    - .md
    - .txt
    - .yaml
    - .yml
    - .toml
    - .json
    - .rs
    - .py
review:
  llm_required: true
  max_diff_chars: 50000
  max_comment_chars: 16000
  agent_enabled: true
  agent_max_steps: 15
  agent_max_file_chars: 30000
sensitive_paths:
  - crates/komodo-api/**
  - crates/komodo-mcp/**
  - crates/komodo-server/src/auth.rs
  - crates/komodo-server/src/config.rs
  - Dockerfile
  - .github/workflows/**
  - .github/pr-review/**
  - scripts/test_image.sh
  - scripts/publish_image.py
  - scripts/scan_image.sh
  - scripts/record_build.py
  - deny.toml
  - .github/dependabot.yml
impact_map:
  crates/komodo-api/**: "Komodo credential, request, response-bound, retry, and sensitive-field normalization boundary"
  crates/komodo-mcp/**: "Model-visible schemas, tool dispatch, annotations, and gateway classification registry"
  crates/komodo-server/src/auth.rs: "Private bearer and gateway identity JWT verification boundary"
  crates/komodo-server/src/config.rs: "Environment-injected secret and bounded runtime configuration boundary"
  Dockerfile: "Published non-root service image and build supply chain"
  .github/workflows/**: "CI and GHCR publication boundary"
  .github/pr-review/**: "AERB review and security policy"
  scripts/test_image.sh: "Isolated source-image validation"
  scripts/publish_image.py: "Validated GHCR publication and workflow credential handling"
  scripts/scan_image.sh: "Container and source inventory with vulnerability gating"
  scripts/record_build.py: "Unsigned source/image identity and evidence hashes"
  deny.toml: "Dependency advisory, source and license policy"
research:
  enabled: true
  max_collect_steps: 15
  max_enhance_steps: 8
  max_page_chars: 12000
  max_sources: 10
  max_report_chars: 16000
  timeout_seconds: 300
security_policy: security.yaml
timeout_seconds: 120
